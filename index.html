  /* --- 2. STORE & STATE MANAGEMENT --- */
  /**
 * TRACES-CO - Store & State Management
 * Sinkronisasi state lokal (localStorage + in-memory fallback)
 */

const STORAGE_KEY = "TRACES_CO_BANSOS_PACKAGES_V1";
const ROLE_KEY = "TRACES_CO_ACTIVE_ROLE";
const ACTIVE_CITIZEN_KEY = "TRACES_CO_ACTIVE_CITIZEN_ID";

// In-Memory Storage Fallback jika localStorage diblokir oleh browser / iframe
const memoryStore = {};

function safeStorageGet(key) {
  try {
    if (typeof window !== 'undefined' && window.localStorage) {
      return window.localStorage.getItem(key);
    }
  } catch (e) {
    console.warn("Storage restricted, using in-memory store:", e.message);
  }
  return memoryStore[key] || null;
}

function safeStorageSet(key, value) {
  try {
    if (typeof window !== 'undefined' && window.localStorage) {
      window.localStorage.setItem(key, value);
      return;
    }
  } catch (e) {
    console.warn("Storage restricted, using in-memory store:", e.message);
  }
  memoryStore[key] = value;
}

// Simulasi Pseudo-Hash SHA-256 untuk Audit Trail Blockchain
function generateSimulatedHash(seedStr) {
  let hash = 0x811c9dc5;
  const str = seedStr + Date.now().toString(36) + Math.random().toString(36);
  for (let i = 0; i < str.length; i++) {
    hash ^= str.charCodeAt(i);
    hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
  }
  const hexPart1 = (hash >>> 0).toString(16).padStart(8, '0');
  const hexPart2 = Math.floor(Math.random() * 0xFFFFFFFF).toString(16).padStart(8, '0');
  const hexPart3 = Math.floor(Math.random() * 0xFFFFFFFF).toString(16).padStart(8, '0');
  const hexPart4 = Math.floor(Math.random() * 0xFFFFFFFF).toString(16).padStart(8, '0');
  return "0x" + hexPart1 + hexPart2 + hexPart3 + hexPart4;
}

function getFormattedTime() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const day = pad(d.getDate());
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  const month = monthNames[d.getMonth()];
  const year = d.getFullYear();
  const hours = pad(d.getHours());
  const minutes = pad(d.getMinutes());
  const seconds = pad(d.getSeconds());
  return `${day} ${month} ${year} ${hours}:${minutes}:${seconds} WIB`;
}

class BansosStore {
  constructor() {
    this.packages = [];
    this.activeRole = "PEMERINTAH"; // 'PEMERINTAH' | 'KELURAHAN' | 'PENERIMA'
    this.activeCitizenId = "TRC-2026-JKT-101"; // Default login citizen
    this.listeners = [];
    this.init();
  }

  init() {
    const savedData = safeStorageGet(STORAGE_KEY);
    if (savedData) {
      try {
        this.packages = JSON.parse(savedData);
      } catch (e) {
        console.error("Gagal parse saved data, memuat data default", e);
        this.packages = JSON.parse(JSON.stringify(DEFAULT_PACKAGES));
      }
    } else {
      this.packages = JSON.parse(JSON.stringify(DEFAULT_PACKAGES));
      this.save();
    }

    const savedRole = safeStorageGet(ROLE_KEY);
    if (savedRole && ["PEMERINTAH", "KELURAHAN", "PENERIMA"].includes(savedRole)) {
      this.activeRole = savedRole;
    }

    const savedCitizen = safeStorageGet(ACTIVE_CITIZEN_KEY);
    if (savedCitizen && this.getPackageById(savedCitizen)) {
      this.activeCitizenId = savedCitizen;
    }
  }

  save() {
    safeStorageSet(STORAGE_KEY, JSON.stringify(this.packages));
    this.notify();
  }

  notify() {
    this.listeners.forEach(fn => {
      try {
        fn(this.packages, this.activeRole, this.activeCitizenId);
      } catch (err) {
        console.error("Error in store listener:", err);
      }
    });
  }

  subscribe(listener) {
    this.listeners.push(listener);
    return () => {
      this.listeners = this.listeners.filter(fn => fn !== listener);
    };
  }

  setRole(role) {
    if (["PEMERINTAH", "KELURAHAN", "PENERIMA"].includes(role)) {
      this.activeRole = role;
      safeStorageSet(ROLE_KEY, role);
      this.notify();
    }
  }

  setActiveCitizen(packageId) {
    const pkg = this.getPackageById(packageId);
    if (pkg) {
      this.activeCitizenId = packageId;
      safeStorageSet(ACTIVE_CITIZEN_KEY, packageId);
      this.notify();
    }
  }

  getPackages() {
    return this.packages;
  }

  getPackageById(id) {
    return this.packages.find(p => p.id === id || p.barcode === id);
  }

  resetToDefault() {
    this.packages = JSON.parse(JSON.stringify(DEFAULT_PACKAGES));
    this.activeCitizenId = "TRC-2026-JKT-101";
    this.save();
  }

  // --- ACTIONS ---

  // 1. Tambah Paket Baru (Pemerintah)
  addPackage(formData) {
    const seq = 100 + this.packages.length + 1;
    const newId = `TRC-2026-JKT-${seq}`;
    const newBarcode = `TRC2026JKT${seq}`;
    const timestamp = getFormattedTime();

    const initialBlock = {
      block: 1,
      waktu: timestamp,
      aksi: "PAKET_DIBUAT",
      aktor: `Kemensos Pusat (Petugas: ${formData.operator || 'Admin Pusat'})`,
      deskripsi: `Paket Bansos dialokasikan untuk ${formData.namaPenerima} di Kelurahan ${formData.kelurahan}.`,
      hash: generateSimulatedHash(newId + timestamp)
    };

    const newPkg = {
      id: newId,
      barcode: newBarcode,
      penerima: {
        nama: formData.namaPenerima,
        nik: formData.nik,
        noHp: formData.noHp || "0812-0000-0000",
        kelurahan: formData.kelurahan,
        alamat: formData.alamat,
        kota: "Jakarta Pusat",
        lat: formData.lat || -6.1950 + (Math.random() - 0.5) * 0.02,
        lng: formData.lng || 106.8400 + (Math.random() - 0.5) * 0.02
      },
      items: formData.items || [
        { nama: "Beras Premium", jumlah: "5 kg", checked: true },
        { nama: "Minyak Goreng Kemasan", jumlah: "1 Liter", checked: true },
        { nama: "Gula Pasir Kristal", jumlah: "1 kg", checked: true }
      ],
      status: "DIBUAT",
      createdAt: timestamp,
      updatedAt: timestamp,
      kurir: null,
      kelurahanAsal: {
        nama: `Kantor Kelurahan ${formData.kelurahan}`,
        alamat: `Jl. Prapatan Utama No. 1, ${formData.kelurahan}`,
        lat: -6.1930,
        lng: 106.8320
      },
      laporan: null,
      tandaTerima: null,
      auditTrail: [initialBlock]
    };

    this.packages.unshift(newPkg);
    this.save();
    return newPkg;
  }

  // 2. Scan Masuk di Kelurahan
  scanKelurahanMasuk(packageId, adminName = "Admin Distribusi") {
    const pkg = this.getPackageById(packageId);
    if (!pkg) return { success: false, message: "Paket tidak ditemukan!" };

    if (pkg.status !== "DIBUAT") {
      return { 
        success: false, 
        message: `Paket sudah berstatus '${pkg.status}'. Tidak perlu scan penerimaan ulang.` 
      };
    }

    const timestamp = getFormattedTime();
    pkg.status = "DITERIMA_KELURAHAN";
    pkg.updatedAt = timestamp;

    const newBlock = {
      block: pkg.auditTrail.length + 1,
      waktu: timestamp,
      aksi: "SCAN_MASUK_KELURAHAN",
      aktor: `${pkg.kelurahanAsal.nama} (${adminName})`,
      deskripsi: "Paket fisik diterima di kantor kelurahan dan siap didistribusikan ke penerima.",
      hash: generateSimulatedHash(pkg.id + timestamp + "SCAN_MASUK")
    };

    pkg.auditTrail.push(newBlock);
    this.save();
    return { success: true, package: pkg };
  }

  // 3. Dispatch Kurir Menuju Penerima (GPS Aktif)
  dispatchKurir(packageId, kurirData) {
    const pkg = this.getPackageById(packageId);
    if (!pkg) return { success: false, message: "Paket tidak ditemukan!" };

    const timestamp = getFormattedTime();
    pkg.status = "DALAM_PENGIRIMAN";
    pkg.updatedAt = timestamp;
    pkg.kurir = {
      nama: kurirData?.nama || "Budi Santoso",
      telepon: kurirData?.telepon || "0812-7788-9900",
      kendaraan: kurirData?.kendaraan || "Motor Logistik Bansos (B 3341 PKM)",
      eta: "15 Menit",
      lat: pkg.kelurahanAsal.lat,
      lng: pkg.kelurahanAsal.lng
    };

    const newBlock = {
      block: pkg.auditTrail.length + 1,
      waktu: timestamp,
      aksi: "DISPATCH_KURIR",
      aktor: `Armada Logistik (${pkg.kurir.nama})`,
      deskripsi: `Paket sedang dibawa kurir menuju alamat penerima (${pkg.penerima.alamat}). Pelacakan GPS diaktifkan.`,
      hash: generateSimulatedHash(pkg.id + timestamp + "DISPATCH")
    };

    pkg.auditTrail.push(newBlock);
    this.save();
    return { success: true, package: pkg };
  }

  // 4. Update Koordinat GPS Kurir
  updateKurirLocation(packageId, lat, lng, eta) {
    const pkg = this.getPackageById(packageId);
    if (pkg && pkg.kurir) {
      pkg.kurir.lat = lat;
      pkg.kurir.lng = lng;
      if (eta) pkg.kurir.eta = eta;
      this.save();
    }
  }

  // 5. Verifikasi Penerimaan: Sesuai & Terima Bantuan (SELESAI)
  verifySuccess(packageId, signatureData, catatan = "Bantuan telah diterima sesuai.") {
    const pkg = this.getPackageById(packageId);
    if (!pkg) return { success: false, message: "Paket tidak ditemukan!" };

    const timestamp = getFormattedTime();
    const bastNumber = `BAST-BANSOS/2026/XI/${Math.floor(1000 + Math.random() * 9000)}`;

    pkg.status = "SELESAI";
    pkg.updatedAt = timestamp;
    if (pkg.kurir) pkg.kurir.eta = "Telah Tiba";

    pkg.tandaTerima = {
      nomorBAST: bastNumber,
      waktuPenerimaan: timestamp,
      namaPenerima: pkg.penerima.nama,
      nikPenerima: pkg.penerima.nik,
      statusVerifikasi: "SESUAI 100% TERVERIFIKASI",
      catatan: catatan,
      signatureData: signatureData
    };

    const newBlock = {
      block: pkg.auditTrail.length + 1,
      waktu: timestamp,
      aksi: "VERIFIKASI_PENERIMA_SESUAI",
      aktor: `Penerima Bansos (${pkg.penerima.nama} - NIK: ${pkg.penerima.nik})`,
      deskripsi: `Penerima telah memverifikasi isi paket bansos 100% lengkap & menandatangani BAST Digital ${bastNumber}.`,
      hash: generateSimulatedHash(pkg.id + timestamp + "VERIFIED_OK")
    };

    pkg.auditTrail.push(newBlock);
    this.save();
    return { success: true, package: pkg, bastNumber };
  }

  // 6. Verifikasi Penerimaan: Tidak Sesuai / Laporkan (BERMASALAH)
  reportIssue(packageId, reportData) {
    const pkg = this.getPackageById(packageId);
    if (!pkg) return { success: false, message: "Paket tidak ditemukan!" };

    const timestamp = getFormattedTime();
    const tiketId = `LAP-2026-${Math.floor(1000 + Math.random() * 9000)}`;

    pkg.status = "BERMASALAH";
    pkg.updatedAt = timestamp;

    pkg.laporan = {
      idTiket: tiketId,
      waktuLapor: timestamp,
      kategori: reportData.kategori,
      kategoriTeks: reportData.kategoriTeks || reportData.kategori,
      itemBermasalah: reportData.itemBermasalah || [],
      keterangan: reportData.keterangan || "Tidak ada keterangan tambahan",
      fotoUrl: reportData.fotoUrl || null,
      statusTindakLanjut: "INVESTIGASI_KELURAHAN"
    };

    const newBlock = {
      block: pkg.auditTrail.length + 1,
      waktu: timestamp,
      aksi: "LAPORAN_KETIDAKSESUAIAN",
      aktor: `Penerima Bansos (${pkg.penerima.nama})`,
      deskripsi: `Warga melaporkan ketidaksesuaian (${reportData.kategoriTeks}). Tiket: ${tiketId}. Perlu investigasi posko distribusi.`,
      hash: generateSimulatedHash(pkg.id + timestamp + "REPORT_ISSUE")
    };

    pkg.auditTrail.push(newBlock);
    this.save();
    return { success: true, package: pkg, tiketId };
  }

  // 7. Resolusi Laporan Masalah (Kelurahan / Pemerintah)
  resolveIssue(packageId, solusi, catatanAdmin) {
    const pkg = this.getPackageById(packageId);
    if (!pkg || !pkg.laporan) return { success: false, message: "Laporan tidak ditemukan!" };

    const timestamp = getFormattedTime();
    pkg.laporan.statusTindakLanjut = solusi;
    pkg.laporan.catatanAdmin = catatanAdmin;

    if (solusi === 'SELESAI_DAMAI') {
      pkg.status = "SELESAI";
    }

    const newBlock = {
      block: pkg.auditTrail.length + 1,
      waktu: timestamp,
      aksi: "RESOLUSI_PENGADUAN",
      aktor: "Admin Kelurahan / Dinsos",
      deskripsi: `Laporan warga ${pkg.laporan.idTiket} ditindaklanjuti dengan status: ${solusi}. Catatan: ${catatanAdmin}`,
      hash: generateSimulatedHash(pkg.id + timestamp + "RESOLVE")
    };

    pkg.auditTrail.push(newBlock);
    this.save();
    return { success: true, package: pkg };
  }
}

  /**
 * TRACES-CO - QR Code & Barcode Helper
 * Merender QR Code dan Barcode ke dalam elemen DOM/Canvas/SVG
 * Handal baik online (via CDN library) maupun offline (via procedural SVG fallback)
 */

window.QRHelper = {
  // Render QR Code ke container element
  renderQR: function (container, text, size = 180) {
    if (typeof container === 'string') {
      container = document.getElementById(container);
    }
    if (!container) return;

    container.innerHTML = '';

    // Jika library QRCode dari CDN tersedia
    if (window.QRCode) {
      try {
        new QRCode(container, {
          text: text,
          width: size,
          height: size,
          colorDark: "#0B2545", // Government Navy
          colorLight: "#FFFFFF",
          correctLevel: QRCode.CorrectLevel.M
        });
        return;
      } catch (e) {
        console.warn("Gagal menggunakan QRCode CDN, beralih ke SVG visual generator", e);
      }
    }

    // Fallback: Elegant Procedural SVG QR Matrix
    container.innerHTML = this.generateFallbackQRSVG(text, size);
  },

  // Render Barcode ke canvas atau svg
  renderBarcode: function (target, text, options = {}) {
    if (typeof target === 'string') {
      target = document.getElementById(target);
    }
    if (!target) return;

    if (window.JsBarcode) {
      try {
        JsBarcode(target, text, {
          format: "CODE128",
          lineColor: "#0F172A",
          width: options.width || 2,
          height: options.height || 50,
          displayValue: options.displayValue !== false,
          fontSize: 13,
          font: "monospace",
          textMargin: 4,
          background: "#FFFFFF"
        });
        return;
      } catch (e) {
        console.warn("Gagal menggunakan JsBarcode CDN, beralih ke SVG fallback", e);
      }
    }

    // Fallback: Clean SVG Barcode
    this.renderFallbackBarcodeSVG(target, text, options);
  },

  // Procedural SVG QR Code visual representation
  generateFallbackQRSVG: function (text, size = 180) {
    // Generate distinct pseudo-random modules based on text hash
    let hash = 0;
    for (let i = 0; i < text.length; i++) {
      hash = ((hash << 5) - hash) + text.charCodeAt(i);
      hash |= 0;
    }

    const grid = 25;
    const cellSize = size / grid;
    let rects = '';

    // Helper draw Finder Pattern
    const drawFinder = (startX, startY) => {
      let f = '';
      // Outer 7x7
      f += `<rect x="${startX * cellSize}" y="${startY * cellSize}" width="${7 * cellSize}" height="${7 * cellSize}" fill="#0B2545" rx="3"/>`;
      // White inner 5x5
      f += `<rect x="${(startX + 1) * cellSize}" y="${(startY + 1) * cellSize}" width="${5 * cellSize}" height="${5 * cellSize}" fill="#FFFFFF" rx="2"/>`;
      // Center 3x3
      f += `<rect x="${(startX + 2) * cellSize}" y="${(startY + 2) * cellSize}" width="${3 * cellSize}" height="${3 * cellSize}" fill="#059669" rx="1.5"/>`;
      return f;
    };

    rects += drawFinder(1, 1);
    rects += drawFinder(grid - 8, 1);
    rects += drawFinder(1, grid - 8);

    // Fill modules with deterministic pattern
    for (let r = 0; r < grid; r++) {
      for (let c = 0; c < grid; c++) {
        // Skip finders & separators
        const inFinder1 = (r <= 8 && c <= 8);
        const inFinder2 = (r <= 8 && c >= grid - 9);
        const inFinder3 = (r >= grid - 9 && c <= 8);
        if (inFinder1 || inFinder2 || inFinder3) continue;

        // Timing patterns
        if (r === 6 || c === 6) {
          if ((r + c) % 2 === 0) {
            rects += `<rect x="${c * cellSize}" y="${r * cellSize}" width="${cellSize - 0.5}" height="${cellSize - 0.5}" fill="#0B2545" rx="0.5"/>`;
          }
          continue;
        }

        // Pseudo pseudo-random based on hash & coordinates
        const val = Math.sin(r * 12.9898 + c * 78.233 + hash) * 43758.5453;
        const isDark = (val - Math.floor(val)) > 0.46;

        if (isDark) {
          rects += `<rect x="${c * cellSize}" y="${r * cellSize}" width="${cellSize - 0.5}" height="${cellSize - 0.5}" fill="#0B2545" rx="0.5"/>`;
        }
      }
    }

    // Emerald center shield watermark
    const center = size / 2;
    const badge = `
      <circle cx="${center}" cy="${center}" r="${cellSize * 2.2}" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
      <circle cx="${center}" cy="${center}" r="${cellSize * 1.6}" fill="#059669"/>
      <path d="M ${center - 4} ${center} L ${center - 1} ${center + 3} L ${center + 5} ${center - 3}" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    `;

    return `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" class="rounded-lg shadow-sm">
        <rect width="${size}" height="${size}" fill="#FFFFFF" rx="8"/>
        ${rects}
        ${badge}
      </svg>
    `;
  },

  renderFallbackBarcodeSVG: function (target, text, options = {}) {
    const width = options.width || 280;
    const height = options.height || 54;
    const barsCount = 45;
    const barW = (width - 20) / barsCount;

    let bars = '';
    let hash = 0;
    for (let i = 0; i < text.length; i++) hash += text.charCodeAt(i);

    for (let i = 0; i < barsCount; i++) {
      const isThick = ((i * 7 + hash) % 3 === 0);
      const isGap = ((i * 11 + hash) % 4 === 1);
      if (!isGap) {
        const x = 10 + i * barW;
        const w = isThick ? barW * 0.9 : barW * 0.5;
        bars += `<rect x="${x}" y="6" width="${w}" height="${height - 22}" fill="#0F172A"/>`;
      }
    }

    const svg = `
      <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
        <rect width="${width}" height="${height}" fill="#FFFFFF"/>
        ${bars}
        <text x="${width / 2}" y="${height - 4}" font-family="monospace" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">${text}</text>
      </svg>
    `;

    if (target.tagName.toLowerCase() === 'svg') {
      target.outerHTML = svg;
    } else {
      target.innerHTML = svg;
    }
  }
};

  /**
 * TRACES-CO - GPS Tracking & Telemetry Module
 * Modul pemantauan pergerakan kurir bansos secara real-time
 */

class GPSTracker {
  constructor(mapContainerId, telemetryContainerId) {
    this.mapContainerId = mapContainerId;
    this.telemetryContainerId = telemetryContainerId;
    this.map = null;
    this.routePolyline = null;
    this.courierMarker = null;
    this.originMarker = null;
    this.destMarker = null;
    this.currentPackage = null;
    this.animInterval = null;
    this.progress = 0.45; // 0.0 to 1.0
  }

  init(pkg) {
    this.currentPackage = pkg;
    const container = document.getElementById(this.mapContainerId);
    if (!container) return;

    if (!pkg || !pkg.penerima) {
      container.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full text-slate-400 p-6 text-center">
          <svg class="w-12 h-12 mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A2 2 0 013 16.382V5.618a2 2 0 011.447-1.894L9 1m0 19l6-3m-6 3V1m6 19l5.447-2.724A2 2 0 0021 16.382V5.618a2 2 0 00-1.447-1.894L15 1m0 19V1m0 0L9 4"></path>
          </svg>
          <p class="font-medium text-xs">Pilih paket dengan status "Dalam Pengiriman" untuk melihat modul GPS Live.</p>
        </div>
      `;
      this.updateTelemetry(null);
      return;
    }

    // Hitung posisi awal (Kelurahan) dan tujuan (Penerima)
    const origin = [pkg.kelurahanAsal?.lat || -6.1945, pkg.kelurahanAsal?.lng || 106.8315];
    const dest = [pkg.penerima?.lat || -6.1985, pkg.penerima?.lng || 106.8402];

    // Cek ketersediaan Leaflet dengan fallback aman
    if (window.L && typeof window.L.map === 'function') {
      try {
        this.renderLeafletMap(container, origin, dest, pkg);
      } catch (err) {
        console.warn("Leaflet error, menggunakan fallback peta taktis vektor:", err);
        this.renderFallbackMap(container, origin, dest, pkg);
      }
    } else {
      this.renderFallbackMap(container, origin, dest, pkg);
    }

    this.updateTelemetry(pkg);
  }

  renderLeafletMap(container, origin, dest, pkg) {
    // 1. Bersihkan instance map lama dan _leaflet_id untuk mencegah error "Map container is already initialized"
    if (this.map) {
      try {
        this.map.remove();
      } catch (e) {}
      this.map = null;
    }

    if (container._leaflet_id) {
      try {
        delete container._leaflet_id;
      } catch (e) {
        container._leaflet_id = null;
      }
    }

    container.innerHTML = '';

    // Cek ukuran kontainer agar Leaflet tidak menghitung batas NaN
    const rect = container.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) {
      // Jika parent belum sepenuhnya terlihat (misal tab baru dibuka)
      this.renderFallbackMap(container, origin, dest, pkg);
      return;
    }

    const midLat = (origin[0] + dest[0]) / 2;
    const midLng = (origin[1] + dest[1]) / 2;

    this.map = L.map(this.mapContainerId, {
      zoomControl: true,
      attributionControl: false
    }).setView([midLat, midLng], 15);

    try {
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(this.map);
    } catch (e) {
      console.warn("Tile layer warning:", e);
    }

    // Custom Icon Posko Kelurahan
    const kelurahanIcon = L.divIcon({
      className: 'custom-map-marker',
      html: `
        <div class="relative flex items-center justify-center w-9 h-9 bg-blue-900 text-white rounded-full border-2 border-white shadow-lg">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
          </svg>
        </div>
      `,
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    // Custom Icon Rumah Penerima
    const destIcon = L.divIcon({
      className: 'custom-map-marker',
      html: `
        <div class="relative flex items-center justify-center w-9 h-9 bg-emerald-600 text-white rounded-full border-2 border-white shadow-lg animate-bounce">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
        </div>
      `,
      iconSize: [36, 36],
      iconAnchor: [18, 18]

    // Custom Icon Kurir Bansos dengan Radar Pulse
    const courierIcon = L.divIcon({
      className: 'custom-courier-marker',
      html: `
        <div class="relative flex items-center justify-center">
          <div class="absolute w-10 h-10 bg-emerald-400 rounded-full animate-ping opacity-75"></div>
          <div class="relative flex items-center justify-center w-9 h-9 bg-emerald-700 text-white rounded-full border-2 border-white shadow-xl">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
        </div>
      `,
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    // Pasang Marker Kelurahan & Penerima
    this.originMarker = L.marker(origin, { icon: kelurahanIcon }).addTo(this.map)

    const points = [

      [origin[0] + (dest[0] - origin[0]) * 0.4, origin[1] + (dest[1] - origin[1]) * 0.2],

    ];

    // Hitung posisi kurir saat ini berdasarkan progress
    const curLat = origin[0] + (dest[0] - origin[0]) * this.progress;

    this.courierMarker = L.marker([curLat, curLng], { icon: courierIcon }).addTo(this.map)

    try {
      const bounds = L.latLngBounds([origin, dest]);
      this.map.fitBounds(bounds, { padding: [40, 40] });

  renderFallbackMap(container, origin, dest, pkg) {

    const etaMinutes = this.progress >= 1 ? "Tiba di Lokasi" : `${Math.ceil((1 - this.progress) * 12)} Menit`;

    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">

        </div>

        <div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5">
          <div class="text-[10px] text-slate-600 font-bold uppercase tracking-wider">Kecepatan GPS</div>
          <div class="text-sm font-bold text-slate-800">${speed} km/jam</div>
          <div class="text-xs text-emerald-600 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sinyal Satelit 4G OK
          </div>
        </div>

        <div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5">
          <div class="text-[10px] text-slate-600 font-bold uppercase tracking-wider">Progress Perjalanan</div>
          <div class="text-sm font-bold text-blue-800">${Math.round(this.progress * 100)}%</div>
          <div class="w-full bg-slate-200 rounded-full h-1.5 mt-1.5 overflow-hidden">
            <div class="bg-blue-600 h-1.5 rounded-full transition-all duration-300" style="width: ${this.progress * 100}%"></div>
          </div>
        </div>
      </div>
    `;
  }

  stepForward(percent = 0.25) {
    if (!this.currentPackage) return;
    this.progress = Math.min(1.0, this.progress + percent);
    this.init(this.currentPackage);

    if (this.progress >= 1.0) {
      if (window.tracesStore) {
        window.tracesStore.updateKurirLocation(
          this.currentPackage.id,
          this.currentPackage.penerima?.lat || -6.1985,
          this.currentPackage.penerima?.lng || 106.8402,
          "Telah Tiba di Alamat"
        );
      }
    }
  }

  resetPosition() {
    this.progress = 0.15;
    this.init(this.currentPackage);
  }

  arriveAtDestination() {
    this.progress = 1.0;
    this.init(this.currentPackage);
  }
}

// --- 1. WEB AUDIO SYNTHESIZER ---
class SoundEffects {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  init() {
    try {
      if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
    } catch (e) {
      this.ctx = null;
    }
  }

  playBeep() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.12);
    } catch (e) {}
  }

  playSuccess() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    try {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + idx * 0.08);
        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.25);
      });
    } catch (e) {}
  }

  playAlert() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, this.ctx.currentTime);
      osc.frequency.setValueAtTime(240, this.ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.35);
    } catch (e) {}
  }
}

// --- 2. SIGNATURE PAD CONTROLLER ---
class SignaturePad {
  constructor(canvasId) {
    this.canvasId = canvasId;
    this.canvas = null;
    this.ctx = null;
    this.isDrawing = false;
    this.hasSignature = false;
  }

  init() {
    this.canvas = document.getElementById(this.canvasId);
    if (!this.canvas) return;

    this.ctx = this.canvas.getContext('2d');
    const rect = this.canvas.getBoundingClientRect();
    const w = rect.width > 0 ? rect.width : 340;
    const h = rect.height > 0 ? rect.height : 140;

    this.canvas.width = w * 2;
    this.canvas.height = h * 2;
    this.ctx.scale(2, 2);
    this.ctx.lineCap = 'round';
    this.ctx.lineJoin = 'round';
    this.ctx.strokeStyle = '#047857';
    this.ctx.lineWidth = 2.5;

    // Mouse Events
    this.canvas.onmousedown = (e) => this.start(e);
    this.canvas.onmousemove = (e) => this.draw(e);
    this.canvas.onmouseup = () => this.stop();
    this.canvas.onmouseleave = () => this.stop();

    // Touch Events
    this.canvas.ontouchstart = (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      this.start({ clientX: touch.clientX, clientY: touch.clientY });
    };

    this.canvas.ontouchmove = (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      this.draw({ clientX: touch.clientX, clientY: touch.clientY });
    };

    this.canvas.ontouchend = (e) => {
      e.preventDefault();
      this.stop();
    };
  }

  getPos(e) {
    if (!this.canvas) return { x: 0, y: 0 };
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  start(e) {
    this.isDrawing = true;
    const pos = this.getPos(e);
    if (this.ctx) {
      this.ctx.beginPath();
      this.ctx.moveTo(pos.x, pos.y);
    }
  }

  draw(e) {
    if (!this.isDrawing || !this.ctx) return;
    const pos = this.getPos(e);
    this.ctx.lineTo(pos.x, pos.y);
    this.ctx.stroke();
    this.hasSignature = true;
  }

  stop() {
    this.isDrawing = false;
  }

  clear() {
    if (!this.ctx || !this.canvas) return;
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.hasSignature = false;
  }

  getDataURL() {
    if (!this.hasSignature || !this.canvas) return null;
    return this.canvas.toDataURL('image/png');
  }
}

function renderApp() {
  if (!window.tracesStore) return;

  const role = window.tracesStore.activeRole || "PEMERINTAH";
  const packages = window.tracesStore.getPackages() || [];

  // 1. Update Role Buttons UI dengan kontras warna yang jelas
  document.querySelectorAll('[data-role-btn]').forEach(btn => {
    const btnRole = btn.getAttribute('data-role-btn');
    if (btnRole === role) {
      btn.className = "flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow-md transition-all whitespace-nowrap";
    } else {
      btn.className = "flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-300 hover:text-white hover:bg-gov-800 transition-all whitespace-nowrap";
    }
  });

  // 2. Tampilkan Role Container yang Aktif
  const elPem = document.getElementById('viewPemerintah');
  const elKel = document.getElementById('viewKelurahan');
  const elPen = document.getElementById('viewPenerima');

  if (elPem) elPem.classList.toggle('hidden', role !== 'PEMERINTAH');
  if (elKel) elKel.classList.toggle('hidden', role !== 'KELURAHAN');
  if (elPen) elPen.classList.toggle('hidden', role !== 'PENERIMA');

  // 3. Render Spesifik View dengan perlindungan try-catch
  try {
    if (role === 'PEMERINTAH') {
      renderPemerintahView(packages);
    } else if (role === 'KELURAHAN') {
      renderKelurahanView(packages);
    } else if (role === 'PENERIMA') {
      renderPenerimaView(packages);
    }
  } catch (err) {
    console.error("Error rendering view for role:", role, err);
  }
}

function renderPemerintahTable() {
  if (!window.tracesStore) return;
  const packages = window.tracesStore.getPackages();
  const search = (document.getElementById('tableSearchInput')?.value || '').toLowerCase().trim();
  const statusFilter = document.getElementById('tableStatusFilter')?.value || 'ALL';
  const kelurahanFilter = document.getElementById('tableKelurahanFilter')?.value || 'ALL';

  const tbody = document.getElementById('packagesTableBody');
  if (!tbody) return;

  const filtered = packages.filter(pkg => {
    const matchSearch = !search ||
      pkg.id.toLowerCase().includes(search) ||
      pkg.penerima?.nama?.toLowerCase().includes(search) ||
      pkg.penerima?.nik?.includes(search);
    const matchStatus = statusFilter === 'ALL' || pkg.status === statusFilter;
    const matchKelurahan = kelurahanFilter === 'ALL' || pkg.penerima?.kelurahan === kelurahanFilter;
    return matchSearch && matchStatus && matchKelurahan;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="text-center py-8 text-slate-400">
          Tidak ada data paket bansos yang sesuai dengan filter pencarian.
        </td>
      </tr>

    return;
  }

  tbody.innerHTML = filtered.map(pkg => {
    const statusBadge = getStatusBadgeHTML(pkg.status);
    const itemsPreview = pkg.items ? pkg.items.map(it => `${it.nama} (${it.jumlah})`).join(', ') : '-';
    const lastBlock = pkg.auditTrail && pkg.auditTrail.length > 0 ? pkg.auditTrail[pkg.auditTrail.length - 1] : null;
    const hashPreview = lastBlock?.hash ? lastBlock.hash.substring(0, 10) + '...' : '-';

    return `
      <tr class="hover:bg-slate-50 border-b border-slate-100 transition-colors">
        <td class="py-3 px-4 font-mono-code font-bold text-blue-900 text-xs">
          ${pkg.id}
          <div class="text-[10px] text-slate-400 font-normal">${pkg.createdAt || ''}</div>
        </td>
        <td class="py-3 px-4">
          <div class="font-bold text-slate-800 text-sm">${pkg.penerima?.nama || '-'}</div>
          <div class="text-xs text-slate-500 font-mono-code">NIK: ${formatMaskedNIK(pkg.penerima?.nik)}</div>
          <div class="text-[11px] text-slate-400 truncate max-w-xs">${pkg.penerima?.alamat || ''}</div>
        </td>
        <td class="py-3 px-4">
          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-slate-100 text-slate-700">
            ${pkg.penerima?.kelurahan || '-'}
          </span>
        </td>
        <td class="py-3 px-4 text-xs text-slate-600 max-w-xs truncate" title="${itemsPreview}">
          ${itemsPreview}
        </td>
        <td class="py-3 px-4">
          ${statusBadge}
        </td>
        <td class="py-3 px-4 font-mono-code text-[11px] text-slate-500">
          <span title="${lastBlock?.hash || ''}">
            ${hashPreview}
          </span>
        </td>
        <td class="py-3 px-4 text-right">
          <div class="flex items-center justify-end gap-1.5">
            <button onclick="openStickerModal('${pkg.id}')" title="Cetak QR Sticker" class="p-1.5 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 transition-colors text-xs font-medium">

              📜 Audit
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function handleNewPackageSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const namaPenerima = form.namaPenerima?.value?.trim() || "";
  let nik = form.nik?.value?.trim() || "";
  const kelurahan = form.kelurahan?.value || "Menteng";
  const noHp = form.noHp?.value?.trim() || "0812-0000-0000";
  const alamat = form.alamat?.value?.trim() || "";
  const operator = form.operator?.value?.trim() || "Admin Kemensos RI";

  if (!namaPenerima || !nik || !alamat) {
    alert("Harap lengkapi semua kolom wajib (Nama Penerima, NIK, dan Alamat)!");
    return;
  }

  // Bersihkan NIK: ambil angka saja
  nik = nik.replace(/\D/g, '');
  if (!nik) {
    alert("NIK harus berupa angka!");
    return;
  }
  // Auto-pad jika kurang dari 16 digit untuk mempermudah testing
  if (nik.length < 16) {
    nik = nik.padEnd(16, '0');
  }

  const items = [
    { nama: "Beras Premium", jumlah: "5 kg", checked: true },
    { nama: "Minyak Goreng Kemasan", jumlah: "1 Liter", checked: true },
    { nama: "Gula Pasir Kristal", jumlah: "1 kg", checked: true }
  ];

  if (form.itemSarden?.checked) {
    items.push({ nama: "Sarden Saus Tomat", jumlah: "2 Kaleng", checked: true });
  }
  if (form.itemMie?.checked) {
    items.push({ nama: "Mie Instan", jumlah: "10 Bungkus", checked: true });
  }

  // Reset filter tabel agar paket baru langsung tampil di urutan teratas
  const searchInp = document.getElementById('tableSearchInput');
  const statFilt = document.getElementById('tableStatusFilter');
  const kelFilt = document.getElementById('tableKelurahanFilter');
  if (searchInp) searchInp.value = '';
  if (statFilt) statFilt.value = 'ALL';
  if (kelFilt) kelFilt.value = 'ALL';

  const newPkg = window.tracesStore.addPackage({
    namaPenerima,
    nik,
    kelurahan,
    noHp,
    alamat,
    operator,
    items
  });

  form.reset();
  sfx.playSuccess();

  // Buka modal stiker label untuk paket yang baru dibuat
  setTimeout(() => {
    openStickerModal(newPkg.id);
  }, 100);
}

function executeScanKelurahan(pkgId) {

function renderMobileTrackingCard(pkg) {
  const container = document.getElementById('mobileTimelineContainer');
  if (!container) return;

  const steps = [
    { key: "DIBUAT", label: "Didaftarkan di Dinsos", desc: pkg.createdAt || '' },
    { key: "DITERIMA_KELURAHAN", label: "Tiba di Posko Kelurahan", desc: pkg.status === 'DIBUAT' ? 'Menunggu kiriman' : 'Terkonfirmasi scan' },
    { key: "DALAM_PENGIRIMAN", label: "Kurir Menuju Alamat", desc: pkg.kurir ? `${pkg.kurir.nama} (ETA: ${pkg.kurir.eta})` : 'Menunggu jadwal armada' },
    { key: "SELESAI", label: "Paket Diterima Warga", desc: pkg.status === 'SELESAI' ? 'Terverifikasi Berita Acara Digital' : (pkg.status === 'BERMASALAH' ? 'Ada Kendala Dilaporkan' : 'Verifikasi saat kurir tiba') }
  ];

  const statusOrder = ["DIBUAT", "DITERIMA_KELURAHAN", "DALAM_PENGIRIMAN", "SELESAI"];
  let activeIdx = statusOrder.indexOf(pkg.status);
  if (pkg.status === 'BERMASALAH') activeIdx = 2;

  container.innerHTML = steps.map((step, idx) => {
    const isCompleted = idx < activeIdx || (pkg.status === 'SELESAI' && idx === 3);
    const isCurrent = idx === activeIdx && pkg.status !== 'SELESAI';
    const isProblem = pkg.status === 'BERMASALAH' && idx === 3;

    let dotClass = "bg-slate-200 border-slate-300 text-slate-400";
    let lineClass = "bg-slate-200";

    if (isCompleted) {
      dotClass = "bg-emerald-600 border-emerald-600 text-white";
      lineClass = "bg-emerald-600";
    } else if (isCurrent) {
      dotClass = "bg-blue-600 border-blue-600 text-white animate-pulse";
    } else if (isProblem) {
      dotClass = "bg-red-600 border-red-600 text-white";
    }

    return `
      <div class="flex items-start gap-3 relative pb-4">
        ${idx < steps.length - 1 ? `
          <div class="absolute left-3.5 top-6 bottom-0 w-0.5 ${lineClass}"></div>
        ` : ''}
        <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold border-2 ${dotClass} z-10 shrink-0">
          ${isCompleted ? '✓' : (idx + 1)}
        </div>
        <div class="pt-0.5">
          <div class="text-xs font-bold text-slate-800">${step.label}</div>
          <div class="text-[11px] text-slate-500">${step.desc}</div>
        </div>
      </div>
    `;
  }).join('');
}

function handleReportIssueSubmit(e) {
  e.preventDefault();
  if (!currentReportPkgId || !window.tracesStore) return;

  const form = e.target;
  const kategori = form.kategoriMasalah?.value || "ISI_KURANG";
  const kategoriSelect = form.kategoriMasalah;
  const kategoriTeks = kategoriSelect?.options[kategoriSelect.selectedIndex]?.text || kategori;
  const keterangan = form.keterangan?.value?.trim() || "Tidak ada rincian tambahan";

  const checkedBoxes = form.querySelectorAll('input[name="itemReport"]:checked');
  const itemBermasalah = Array.from(checkedBoxes).map(cb => cb.value);

  const fotoUrl = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200' viewBox='0 0 300 200'><rect width='300' height='200' fill='%23fee2e2'/><text x='150' y='95' fill='%23dc2626' font-family='sans-serif' font-size='14' font-weight='bold' text-anchor='middle'>[BUKTI FOTO KENDALA]</text><text x='150' y='125' fill='%23991b1b' font-family='sans-serif' font-size='12' text-anchor='middle'>" + encodeURIComponent(kategoriTeks) + "</text></svg>";

  const res = window.tracesStore.reportIssue(currentReportPkgId, {
    kategori,
    kategoriTeks,
    itemBermasalah,
    keterangan,
    fotoUrl
  });

  closeReportModal();
  form.reset();

  if (res.success) {
    sfx.playAlert();
    alert(
      `Laporan Kendala Berhasil Terkirim!\n\n` +
      `Nomor Tiket: ${res.tiketId}\n` +
      `Status paket berubah menjadi 'Bermasalah' dan notifikasi prioritas telah dikirimkan ke Dashboard Kelurahan & Dinsos Pusat.`
    );
  }
}

  const list = document.getElementById('auditTrailList');
  if (list && pkg.auditTrail) {
    list.innerHTML = pkg.auditTrail.map((block, idx) => `
      <div class="relative pl-6 pb-6 border-l-2 ${idx === pkg.auditTrail.length - 1 ? 'border-emerald-500' : 'border-blue-400'} last:pb-0">
        <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full ${idx === pkg.auditTrail.length - 1 ? 'bg-emerald-500 ring-4 ring-emerald-100' : 'bg-blue-600'}"></div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1">
          <div class="flex items-center justify-between text-xs">
            <span class="font-mono-code font-bold text-blue-900 bg-blue-100/70 px-2 py-0.5 rounded">
              BLOCK #${block.block}: ${block.aksi}
            </span>
            <span class="text-slate-500">${block.waktu}</span>
          </div>
          <div class="text-xs font-semibold text-slate-700">Aktor: ${block.aktor}</div>
          <div class="text-xs text-slate-600">${block.deskripsi}</div>
          <div class="pt-1 border-t border-slate-200/60 font-mono-code text-[11px] text-slate-400 truncate">
            Hash: <span class="text-blue-700 font-bold">${block.hash}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('auditModal')?.classList.remove('hidden');
}

function closeAuditModal() {
  document.getElementById('auditModal')?.classList.add('hidden');
}

// --- HELPER UTILITIES ---
function getStatusBadgeHTML(status) {
  switch (status) {
    case 'DIBUAT':
      return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold badge-dibuat">📦 Dibuat</span>`;
    case 'DITERIMA_KELURAHAN':
      return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold badge-kelurahan">🏢 Di Kelurahan</span>`;
    case 'DALAM_PENGIRIMAN':
      return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold badge-pengiriman">🚚 Pengiriman (GPS)</span>`;
    case 'SELESAI':
      return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold badge-selesai">✅ Selesai Terverifikasi</span>`;
    case 'BERMASALAH':
      return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold badge-bermasalah">⚠️ Bermasalah</span>`;
    default:
      return `<span class="px-2 py-1 rounded text-xs bg-slate-100 text-slate-600">${status}</span>`;
  }
}

function formatMaskedNIK(nik) {
  if (!nik || nik.length < 10) return nik || '-';
  return nik.substring(0, 6) + "******" + nik.substring(nik.length - 4);
}
